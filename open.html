<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google-site-verification" content="Ihn5xmushUjUaDypm_IDAc3Z-YQIDOa61yOyv1rl52w" />
    <title>Welcome | A/Maithripala Senanayaka Central College</title>
    <link rel="icon" type="image/png" href="school bage.png">

    <!-- Premium Multi-language Google Fonts (Apple-like Rendering) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700;800;900&family=Noto+Sans+Tamil:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================
           1. APPLE-INSPIRED RESET & CORE VARS
           ========================================================== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        :root {
            --ease-apple: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in-out-apple: cubic-bezier(0.4, 0, 0.2, 1);
            --color-primary-red: #dc2626;
            --color-primary-gold: #d97706;
            --color-dark: #0f172a;
        }

        body {
            background-color: #ffffff;
            background-image: 
                radial-gradient(at 10% 10%, rgba(220, 38, 38, 0.08) 0px, transparent 45%),
                radial-gradient(at 90% 90%, rgba(217, 119, 6, 0.08) 0px, transparent 45%);
            background-attachment: fixed;
            color: var(--color-dark);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 3rem 1.5rem;
            overflow: hidden;
            position: relative;
            user-select: none;
            cursor: pointer;
        }

        /* Ambient Glow Backdrop */
        .glow-bg {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(220, 38, 38, 0.07) 0%, rgba(255, 255, 255, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            filter: blur(40px);
        }

        /* ==========================================================
           2. WELCOME CONTAINER & BADGE
           ========================================================== */
        .welcome-card {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 580px;
            width: 100%;
            margin: auto;
        }

        .badge-container {
            margin-bottom: 2rem;
            will-change: transform, opacity;
        }

        .school-badge {
            width: 110px;
            height: 110px;
            object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(185, 28, 28, 0.2));
            opacity: 0;
            transform: scale(0.6) translateY(10px);
            animation: appleBadgePop 1.1s var(--ease-apple) forwards 0.1s,
                       appleFloat 4s ease-in-out infinite 1.2s;
        }

        /* ==========================================================
           3. APPLE-STYLE MULTI-LANGUAGE SLIDER
           ========================================================== */
        .lang-slider {
            position: relative;
            width: 100%;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            will-change: opacity, transform, height;
        }

        .lang-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            filter: blur(10px);
            pointer-events: none;
            transition: 
                opacity 0.7s var(--ease-apple),
                transform 0.7s var(--ease-apple),
                filter 0.7s var(--ease-apple);
        }

        .lang-slide.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        .lang-slide.exit {
            opacity: 0;
            transform: translateY(-20px) scale(1.03);
            filter: blur(10px);
        }

        /* Typography Styling */
        .welcome-word {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .school-word {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.6;
            letter-spacing: 0.2px;
            max-width: 90%;
            opacity: 0.88;
        }

        /* Sinhala Specifics */
        .lang-slide.sinhala .welcome-word,
        .lang-slide.sinhala .school-word {
            font-family: 'Noto Sans Sinhala', sans-serif;
            color: #b45309;
        }

        /* English Specifics */
        .lang-slide.english .welcome-word,
        .lang-slide.english .school-word {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #b91c1c;
        }

        /* Tamil Specifics */
        .lang-slide.tamil .welcome-word,
        .lang-slide.tamil .school-word {
            font-family: 'Noto Sans Tamil', sans-serif;
            color: #dc2626;
        }

        /* ==========================================================
           4. TYPEWRITER WRAPPER
           ========================================================== */
        .typewriter-wrap {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            min-height: 120px;
            justify-content: center;
        }

        .typewriter-wrap.show {
            display: flex;
            animation: appleFadeInUp 0.8s var(--ease-apple) forwards;
        }

        .typewriter-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #b45309;
            font-weight: 800;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .school-name {
            font-size: 1.05rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: 1px;
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        #typed-text {
            white-space: pre-wrap;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #b91c1c;
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 0.8s step-end infinite;
            border-radius: 1px;
        }

        /* ==========================================================
           5. LOADING DOTS & FOOTER
           ========================================================== */
        .loading-dots-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 1.5rem;
            opacity: 0;
            animation: appleFadeInUp 0.8s var(--ease-apple) forwards 0.8s;
        }

        .loading-dots {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .loading-dots .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #b91c1c;
            animation: applePulse 1.4s ease-in-out infinite;
        }

        .loading-dots .dot:nth-child(2) { 
            animation-delay: 0.2s; 
            background: #f59e0b; 
        }
        .loading-dots .dot:nth-child(3) { 
            animation-delay: 0.4s; 
        }

        .loading-text {
            font-size: 0.72rem;
            color: #64748b;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            font-size: 0.72rem;
            color: #94a3b8;
            letter-spacing: 0.5px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            opacity: 0;
            animation: appleFadeInUp 0.8s var(--ease-apple) forwards 1s;
        }

        footer span {
            color: #475569;
            font-weight: 600;
        }

        /* ==========================================================
           6. ANIMATION KEYFRAMES
           ========================================================== */
        @keyframes appleBadgePop {
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes appleFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        @keyframes appleFadeInUp {
            from {
                opacity: 0;
                transform: translateY(14px);
                filter: blur(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0; }
        }

        @keyframes applePulse {
            0%, 100% { transform: scale(0.85); opacity: 0.4; }
            50%      { transform: scale(1.25); opacity: 1; }
        }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            body { padding: 2rem 1rem; }
            .school-badge { width: 95px; height: 95px; }
            .welcome-word { font-size: 1.75rem; }
            .school-word { font-size: 0.88rem; }
            .school-name { font-size: 0.88rem; }
            .lang-slider { min-height: 125px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="welcome-card">
        <!-- School Badge -->
        <div class="badge-container">
            <img src="school bage.png" alt="School Badge" class="school-badge">
        </div>

        <!-- Language Cycle Slider (Sinhala → Tamil → English) -->
        <div class="lang-slider">
            <!-- Sinhala Slide -->
            <div class="lang-slide sinhala" data-lang="sinhala">
                <div class="welcome-word">ආයුබෝවන්</div>
                <div class="school-word">ආ/මෛත්‍රීපාල සේනානායක මධ්‍ය මහා විද්‍යාලය</div>
            </div>

            <!-- English Slide -->
            <div class="lang-slide english" data-lang="english">
                <div class="welcome-word">Welcome</div>
                <div class="school-word">A/Maithripala Senanayaka Central College</div>
            </div>

            <!-- Tamil Slide -->
            <div class="lang-slide tamil" data-lang="tamil">
                <div class="welcome-word">வணக்கம்</div>
                <div class="school-word">ஏ/மைத்ரிபால சேனாநாயக்க மத்திய கல்லூரி</div>
            </div>
        </div>

        <!-- Typewriter Title Transition -->
        <div class="typewriter-wrap" id="typewriterWrap">
            <div class="typewriter-title">Now Entering</div>
            <h1 class="school-name">
                <span id="typed-text"></span><span class="cursor" id="cursor"></span>
            </h1>
        </div>

        <!-- Loading Dots -->
        <div class="loading-dots-wrap">
            <span class="loading-dots" role="status" aria-label="Loading">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </span>
            <span class="loading-text">Loading Portal</span>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 MSNS.LK &nbsp;<br><span>Designed by K.D.G.S.M. Deniyegedara</span></p>
    </footer>

    <!-- Splash Logic -->
    <script src="js/open.js?v=5"></script>
</body>
</html>
