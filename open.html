<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google-site-verification" content="Ihn5xmushUjUaDypm_IDAc3Z-YQIDOa61yOyv1rl52w" />
    <title>Welcome | A/Maithripala Senanayaka Central College</title>
    <link rel="icon" type="image/png" href="school bage.png">

    <!-- Google Fonts (Multi-language) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================
           GLOBAL RESET
           ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* ==========================================================
           BODY + AMBIENT BACKGROUND (Red & Gold Theme)
           ========================================================== */
        body {
            background-color: #ffffff;
            background-image: 
                radial-gradient(at 0% 0%, rgba(220, 38, 38, 0.07) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(234, 179, 8, 0.07) 0px, transparent 50%);
            background-attachment: fixed;
            color: #0f172a;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2.5rem 1.5rem;
            overflow: hidden;
            position: relative;
        }

        /* Ambient radial glows */
        .glow-bg {
            position: absolute;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(220, 38, 38, 0.10) 0%, rgba(255, 255, 255, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .glow-bg-2 {
            position: absolute;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.10) 0%, rgba(255, 255, 255, 0) 70%);
            top: 25%;
            left: 25%;
            z-index: 0;
            pointer-events: none;
        }

        /* ==========================================================
           MAIN WELCOME CARD
           ========================================================== */
        .welcome-card {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 520px;
            width: 100%;
            margin: auto;
            gap: 0.4rem;
        }

        /* ---------- School Badge (Pop + Float) ---------- */
        .badge-container {
            margin-bottom: 1.6rem;
        }

        .school-badge {
            width: 105px;
            height: 105px;
            object-fit: contain;
            filter: drop-shadow(0 6px 20px rgba(185, 28, 28, 0.25));
            opacity: 0;
            transform: scale(0.7);
            animation: badgeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s,
                       badgeFloat 3.5s ease-in-out infinite 1.2s;
        }

        /* ==========================================================
           LANGUAGE SLIDES (Welcome + School Name per language)
           ========================================================== */
        .lang-slider {
            position: relative;
            width: 100%;
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.6rem;
            overflow: hidden;
        }

        .lang-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            opacity: 0;
            transform: translateY(24px) scale(0.94);
            filter: blur(12px);
            pointer-events: none;
            transition: 
                opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .lang-slide.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        .lang-slide.exit {
            opacity: 0;
            transform: translateY(-24px) scale(1.06);
            filter: blur(12px);
        }

        /* Welcome Word */
        .welcome-word {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        /* School Name */
        .school-word {
            font-size: 0.92rem;
            font-weight: 700;
            line-height: 1.55;
            letter-spacing: 0.4px;
            max-width: 92%;
            opacity: 0.9;
        }

        /* ---------- Language-specific Colors ---------- */
        /* Sinhala - Gold */
        .lang-slide.sinhala .welcome-word {
            color: #b45309;
            font-family: 'Noto Sans Sinhala', sans-serif;
            text-shadow: 0 2px 16px rgba(180, 83, 9, 0.25);
        }
        .lang-slide.sinhala .school-word {
            color: #b45309;
            font-family: 'Noto Sans Sinhala', sans-serif;
        }

        /* English - Red */
        .lang-slide.english .welcome-word {
            color: #b91c1c;
            text-shadow: 0 2px 16px rgba(185, 28, 28, 0.22);
        }
        .lang-slide.english .school-word {
            color: #b91c1c;
        }

        /* Tamil - Deep Red/Orange */
        .lang-slide.tamil .welcome-word {
            color: #dc2626;
            font-family: 'Noto Sans Tamil', sans-serif;
            text-shadow: 0 2px 16px rgba(220, 38, 38, 0.22);
        }
        .lang-slide.tamil .school-word {
            color: #dc2626;
            font-family: 'Noto Sans Tamil', sans-serif;
        }

        /* ==========================================================
           TYPEWRITER (After all 3 languages cycle)
           ========================================================== */
        .typewriter-wrap {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 0.4rem;
            margin-bottom: 0.6rem;
            width: 100%;
        }

        .typewriter-wrap.show {
            display: flex;
            animation: fadeInUp 0.6s ease forwards;
        }

        .typewriter-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #b45309;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .school-name {
            font-size: 1rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: 1.2px;
            line-height: 1.6;
            min-height: 3.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            text-align: center;
            max-width: 100%;
        }

        #typed-text {
            white-space: pre-wrap;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.05em;
            background: #b91c1c;
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 0.9s step-end infinite;
            box-shadow: 0 0 8px rgba(185, 28, 28, 0.7);
        }

        /* ==========================================================
           LOADING DOTS
           ========================================================== */
        .loading-dots-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 0.6rem;
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards 6.8s;
        }

        .loading-dots {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 12px;
        }

        .loading-dots .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #b91c1c;
            box-shadow: 0 0 10px rgba(185, 28, 28, 0.5);
            animation: bouncingDots 1.4s ease-in-out infinite;
        }

        .loading-dots .dot:nth-child(1) { animation-delay: 0s; }
        .loading-dots .dot:nth-child(2) { 
            animation-delay: 0.2s; 
            background: #f59e0b; 
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5); 
        }
        .loading-dots .dot:nth-child(3) { animation-delay: 0.4s; }

        .loading-text {
            font-size: 0.72rem;
            color: #71717a;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-left: 10px;
            font-weight: 700;
        }

        /* ==========================================================
           FOOTER
           ========================================================== */
        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            font-size: 0.7rem;
            color: #a1a1aa;
            letter-spacing: 0.8px;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 7.4s;
        }

        footer span {
            color: #71717a;
            font-weight: 600;
        }

        /* ==========================================================
           KEYFRAMES
           ========================================================== */

        @keyframes badgeIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes badgeFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0; }
        }

        @keyframes bouncingDots {
            0%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        /* ==========================================================
           RESPONSIVE
           ========================================================== */
        @media (max-width: 480px) {
            body {
                padding: 2rem 1rem;
            }

            .school-badge {
                width: 90px;
                height: 90px;
            }

            .lang-slider {
                min-height: 115px;
            }

            .welcome-word {
                font-size: 1.6rem;
            }

            .school-word {
                font-size: 0.82rem;
            }

            .school-name {
                font-size: 0.9rem;
            }

            .loading-dots .dot {
                width: 7px;
                height: 7px;
            }
        }

        /* ==========================================================
           REDUCED MOTION
           ========================================================== */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Background Glows -->
    <div class="glow-bg"></div>
    <div class="glow-bg-2"></div>

    <div class="welcome-card">

        <!-- School Badge -->
        <div class="badge-container">
            <img src="school bage.png" alt="School Badge" class="school-badge">
        </div>

        <!-- ==========================================================
             LANGUAGE SLIDER (Welcome + School Name per language)
             Sinhala → English → Tamil, each with its own school name
             ========================================================== -->
        <div class="lang-slider">

            <!-- Sinhala Slide -->
            <div class="lang-slide sinhala" data-lang="sinhala">
                <div class="welcome-word">සාදරයෙන් පිළිගනිමු</div>
                <div class="school-word">ආ/මෛත්‍රීපාල සේනානායක මධ්‍ය විද්‍යාලය</div>
            </div>

            <!-- English Slide -->
            <div class="lang-slide english" data-lang="english">
                <div class="welcome-word">Welcome</div>
                <div class="school-word">A/Maithripala Senanayaka Central College</div>
            </div>

            <!-- Tamil Slide -->
            <div class="lang-slide tamil" data-lang="tamil">
                <div class="welcome-word">வரவேற்கிறோம்</div>
                <div class="school-word">ஏ/மைத்ரிபால சேனாநாயக்க மத்திய கல்லூரி</div>
            </div>

        </div>

        <!-- ==========================================================
             TYPEWRITER (English school name — after language cycles)
             ========================================================== -->
        <div class="typewriter-wrap" id="typewriterWrap">
            <div class="typewriter-title">Now Entering</div>
            <h1 class="school-name">
                <span id="typed-text"></span><span class="cursor" id="cursor"></span>
            </h1>
        </div>

        <!-- Bouncing Loading Dots -->
        <div class="loading-dots-wrap">
            <span class="loading-dots" role="status" aria-label="Loading">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </span>
            <span class="loading-text">Loading Portal</span>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 MSNS.LK &nbsp; <br><span>Designed by K.D.G.S.M. Deniyegedara</span></p>
    </footer>

    <!-- ==========================================================
         WELCOME SPLASH LOGIC
         ========================================================== -->
    <script src="js/opdn.js?v=4"></script>

</body>
</html>
