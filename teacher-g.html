    <!-- JavaScript Logic -->
    <script>
        (function() {
            'use strict';

            // Google Sheet Configurations for Teacher's Guide
            const SHEET_ID = '1eOlkqUHWBo_PT9rc9IdwPaQtBWcBQ_pK2Z3g7XTqRXM';
            const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
            const ALL_GRADES = ['6', '7', '8', '9', '10', '11', '12', '13'];

            let booksData = { 6: [], 7: [], 8: [], 9: [], 10: [], 11: [], 12: [], 13: [] };
            let currentLang = 'sinhala';
            let currentGrade = '6';

            // Dynamic Auto Scroll Helper Function
            function goToNextStep(elementId) {
                const targetElement = document.getElementById(elementId);
                if (targetElement) {
                    setTimeout(() => {
                        targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 100);
                }
            }

            // DOM Elements
            const gradePillsEl = document.getElementById('gradePills');
            const subjectListEl = document.getElementById('subjectList');
            const langTabBtns = document.querySelectorAll('.lang-tab-btn');
            const previewOverlay = document.getElementById('previewOverlay');
            const previewIframe = document.getElementById('previewIframe');
            const previewClose = document.getElementById('previewClose');
            const backToTopBtn = document.getElementById('backToTop');

            /* Mobile Navigation Drawer */
            const menuToggle = document.getElementById('menuToggle');
            const closeMenu = document.getElementById('closeMenu');
            const sidebar = document.getElementById('sidebar');
            const menuOverlay = document.getElementById('menuOverlay');

            menuToggle.addEventListener('click', () => {
                sidebar.classList.add('active');
                menuOverlay.classList.add('active');
            });

            const hideMenu = () => {
                sidebar.classList.remove('active');
                menuOverlay.classList.remove('active');
            };

            closeMenu.addEventListener('click', hideMenu);
            menuOverlay.addEventListener('click', hideMenu);

            /* Scroll to Top */
            window.addEventListener('scroll', function() {
                if (document.body.scrollTop > 250 || document.documentElement.scrollTop > 250) {
                    backToTopBtn.style.display = "flex";
                } else {
                    backToTopBtn.style.display = "none";
                }
            });
            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            /* Direct Google Drive File ID Extractor */
            function extractDriveId(url) {
                if (!url) return null;
                const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
                return match ? match[1] : null;
            }

            /* CSV Parsing Logic from Old Code */
            function parseCSV(text) {
                let lines = [];
                let row = [];
                let inQuotes = false;
                let currentStr = '';

                for (let i = 0; i < text.length; i++) {
                    let char = text[i];
                    let nextChar = text[i+1];

                    if (char === '"') {
                        if (inQuotes && nextChar === '"') {
                            currentStr += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === ',' && !inQuotes) {
                        row.push(currentStr.trim());
                        currentStr = '';
                    } else if ((char === '\r' || char === '\n') && !inQuotes) {
                        if (char === '\r' && nextChar === '\n') { i++; }
                        row.push(currentStr.trim());
                        if (row.length > 0 && row.some(cell => cell !== '')) {
                            lines.push(row);
                        }
                        row = [];
                        currentStr = '';
                    } else {
                        currentStr += char;
                    }
                }
                if (currentStr || row.length > 0) {
                    row.push(currentStr.trim());
                    lines.push(row);
                }
                return lines;
            }

            /* Fetch Data directly from Google Sheet */
            async function fetchSheetData() {
                try {
                    const response = await fetch(SHEET_CSV_URL);
                    const csvText = await response.text();
                    const rows = parseCSV(csvText);

                    // Reset Data Container
                    for (let g = 6; g <= 13; g++) booksData[g] = [];

                    if (rows.length > 0) {
                        const row0 = rows[0];

                        // Scan across columns for grade blocks (grade6, grade7, etc.)
                        for (let col = 0; col < row0.length; col++) {
                            const cellVal = (row0[col] || '').toLowerCase().replace(/\s+/g, '');
                            const match = cellVal.match(/grade(\d+)/);

                            if (match) {
                                const gradeNum = parseInt(match[1]);
                                if (booksData[gradeNum] !== undefined) {
                                    let linkCol = col;
                                    let subCol = col + 1;
                                    let langCol = col + 2;

                                    // Extract rows starting from Row 2 (Index 2)
                                    for (let r = 2; r < rows.length; r++) {
                                        const rData = rows[r];
                                        if (!rData) continue;
                                        
                                        const link = rData[linkCol] || '';
                                        const subject = rData[subCol] || '';
                                        const language = rData[langCol] || '';

                                        if (subject && link) {
                                            booksData[gradeNum].push({ subject, language, link });
                                        }
                                    }
                                }
                            }
                        }
                    }
                    renderGrades();
                    renderSubjects();
                } catch (err) {
                    console.error("Sheet loading error:", err);
                    subjectListEl.innerHTML = `<div class="no-docs-card">Failed to load data from Google Sheet. Please check connection.</div>`;
                    renderGrades();
                }
            }

            /* Render Grade Pills */
            function renderGrades() {
                let html = '';
                ALL_GRADES.forEach(g => {
                    const active = g === currentGrade ? 'active' : '';
                    html += `<div class="grade-pill ${active}" data-grade="${g}">Grade ${g}</div>`;
                });

                gradePillsEl.innerHTML = html;

                document.querySelectorAll('.grade-pill').forEach(el => {
                    el.addEventListener('click', function() {
                        currentGrade = this.dataset.grade;
                        renderGrades();
                        renderSubjects();

                        // Auto scroll smoothly to Subject List when grade is selected
                        goToNextStep('subjectList');
                    });
                });

                // Auto smooth scroll active pill into center view
                const activePill = gradePillsEl.querySelector('.grade-pill.active');
                if (activePill) {
                    activePill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }

            /* Render Subject Cards Layout (Image 02 Structure) */
            function renderSubjects() {
                const gradeBooks = booksData[parseInt(currentGrade)] || [];

                // Filter books by Language
                const filtered = gradeBooks.filter(item => {
                    const l = (item.language || '').toLowerCase();
                    if (currentLang === 'sinhala') {
                        return l.includes('sinhala');
                    } else if (currentLang === 'english') {
                        return l.includes('english');
                    }
                    return true;
                });

                if (filtered.length === 0) {
                    subjectListEl.innerHTML = `
                        <div class="no-docs-card">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                            <div>Documents not found for Grade ${currentGrade} — ${currentLang.toUpperCase()}</div>
                        </div>
                    `;
                    return;
                }

                let html = '';
                filtered.forEach(item => {
                    const fileId = extractDriveId(item.link);

                    // Direct Drive Links
                    const downloadUrl = fileId 
                        ? `https://drive.usercontent.google.com/download?id=${fileId}&export=download` 
                        : item.link;

                    const previewUrl = fileId 
                        ? `https://drive.google.com/file/d/${fileId}/preview` 
                        : item.link;

                    html += `
                        <div class="subject-card">
                            <div class="subject-header">
                                <svg class="subject-icon-red" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="16" y1="13" x2="8" y2="13"></line>
                                    <line x1="16" y1="17" x2="8" y2="17"></line>
                                </svg>
                                <span class="subject-title">${escapeHtml(item.subject)}</span>
                            </div>
                            <div class="subject-actions">
                                <button class="action-btn btn-preview" onclick="openPdfPreview('${previewUrl}')">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                    Preview
                                </button>
                                <a href="${downloadUrl}" class="action-btn btn-download" download target="_blank">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                        <polyline points="7 10 12 15 17 10"></polyline>
                                        <line x1="12" y1="15" x2="12" y2="3"></line>
                                    </svg>
                                    Download
                                </a>
                            </div>
                        </div>
                    `;
                });

                subjectListEl.innerHTML = html;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            /* PDF Modal Preview Control */
            window.openPdfPreview = function(url) {
                if (!url || url === '#') {
                    alert('Preview URL is not available.');
                    return;
                }
                previewIframe.src = url;
                previewOverlay.classList.add('active');
            };

            function closePreview() {
                previewOverlay.classList.remove('active');
                previewIframe.src = 'about:blank';
            }

            previewClose.addEventListener('click', closePreview);
            previewOverlay.addEventListener('click', (e) => {
                if (e.target === previewOverlay) closePreview();
            });

            // Language Switcher Logic
            langTabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    langTabBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentLang = this.dataset.lang;
                    renderSubjects();

                    // Auto scroll smoothly to Grade Selector Section when medium changes
                    goToNextStep('gradePillsSection');
                });
            });

            // Initialize Sheet Data Loading
            fetchSheetData();
        })();
     <!-- Universal Header Overlap Fix Script -->
(function() {
    'use strict';

    function fixHeaderOverlap() {
        // Header එක සොයා ගැනීම (header#top හෝ සාමාන්‍ය header)
        const header = document.querySelector('header#top') || document.querySelector('header');
        if (!header) return;

        // Header එකේ උස (Height) ගණනය කිරීම
        const headerHeight = header.offsetHeight || 65;
        const safeOffset = headerHeight + 15; // Extra 15px clearance

        // Global Scroll Padding සකස් කිරීම
        document.documentElement.style.scrollPaddingTop = safeOffset + 'px';

        // Dynamic Style Tag එකක් මගින් සියලුම Elements වලට Scroll Margin එකතු කිරීම
        let styleTag = document.getElementById('auto-header-fix-style');
        if (!styleTag) {
            styleTag = document.createElement('style');
            styleTag.id = 'auto-header-fix-style';
            document.head.appendChild(styleTag);
        }

        styleTag.innerHTML = `
            html {
                scroll-padding-top: ${safeOffset}px !important;
            }
            .content-wrapper {
                margin-top: 5px;
            }
            .subject-card, 
            .grade-selector, 
            .lang-selection-section, 
            .news-banner, 
            section, 
            [id] {
                scroll-margin-top: ${safeOffset}px !important;
            }
        `;
    }

    // Page එක Load වෙද්දී සහ Resize වෙද්දී Auto-run වීම
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', fixHeaderOverlap);
    } else {
        fixHeaderOverlap();
    }

    window.addEventListener('resize', fixHeaderOverlap);
    window.addEventListener('load', fixHeaderOverlap);
})();
    </script>
