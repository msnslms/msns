  <style>/* බටන් දෙක එකට යටින් එක තැබීමට wrap එක */
.download-btn-wrap {
    display: flex;
    flex-direction: column; /* එකට යටින් එක පිහිටීමට */
    align-items: center;    /* මැදට Align කිරීමට */
    gap: 16px;              /* බටන් දෙක අතර පරතරය */
    margin: 30px 0;
    width: 100%;
}

/* 'ex' class එක සඳහා විශාල ලස්සන Button Style එක (Red & Gold Theme) */
.ex {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    max-width: 380px;       /* බටන් එකේ පළල */
    padding: 16px 28px;     /* බටන් එක ලොකුවට පෙනීමට */
    background: linear-gradient(135deg, #dc2626 0%, #b91c1c 50%, #991b1b 100%); /* deep red gradient */
    color: #ffffff;
    font-size: 18px;        /* අකුරු ප්‍රමාණය */
    font-weight: 700;
    font-family: Arial, sans-serif;
    text-decoration: none;
    border-radius: 12px;
    border: 1px solid rgba(234, 179, 8, 0.35); /* gold accent border */
    box-shadow: 
        0 8px 20px rgba(185, 28, 28, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.25),
        0 0 0 0 rgba(234, 179, 8, 0); /* 3D shadow + inner highlight + glow placeholder */
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
}

/* Shine / Gloss Effect — බටන් එක උඩින් ලාවට එළියක් යනවා වගේ */
.ex::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
        120deg,
        transparent 0%,
        rgba(255, 255, 255, 0.25) 50%,
        transparent 100%
    );
    transform: skewX(-20deg);
    transition: left 0.6s ease;
    pointer-events: none;
}

/* Gold Glow Strip එක බටන් එකේ උඩින් */
.ex::after {
    content: '';
    position: absolute;
    top: 0;
    left: 10%;
    right: 10%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #fbbf24, #f59e0b, #fbbf24, transparent);
    border-radius: 2px;
    opacity: 0.85;
    pointer-events: none;
}

/* Cursor එක තැබූ විට (Hover Effect) */
.ex:hover {
    transform: translateY(-3px); /* උඩට උස් වන සංක්‍රාන්තිය */
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 50%, #b91c1c 100%);
    border-color: rgba(234, 179, 8, 0.65);
    box-shadow: 
        0 14px 30px rgba(185, 28, 28, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.3),
        0 0 24px 2px rgba(234, 179, 8, 0.28); /* gold glow */
    color: #ffffff;
}

/* Hover වලදී Shine එක වමේ සිට දකුණට යනවා */
.ex:hover::before {
    left: 150%;
}

/* Click (Active) කරන විට */
.ex:active {
    transform: translateY(-1px) scale(0.99);
    box-shadow: 
        0 6px 14px rgba(185, 28, 28, 0.4),
        inset 0 2px 4px rgba(0, 0, 0, 0.15);
}

/* බටන් එක ඇතුළේ ඇති Icon එකේ ප්‍රමාණය */
.ex svg {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2));
    transition: transform 0.3s ease;
}

/* Hover වලදී icon එක ලාවට චලනය වෙනවා */
.ex:hover svg {
    transform: scale(1.08) rotate(-3deg);
}
</style>

    <!-- JavaScript Navigation Logic -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const closeMenu = document.getElementById('closeMenu');
        const sidebar = document.getElementById('sidebar');
        const menuOverlay = document.getElementById('menuOverlay');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.add('active');
            menuOverlay.classList.add('active');
        });

        const hideMenuHub = () => {
            sidebar.classList.remove('active');
            menuOverlay.classList.remove('active');
        };

        closeMenu.addEventListener('click', hideMenuHub);
        menuOverlay.addEventListener('click', hideMenuHub);
   
    /* Back to Top Floating Action */
        const backToTopBtn = document.getElementById('backToTop');

        window.onscroll = function() {
            if (document.body.scrollTop > 250 || document.documentElement.scrollTop > 250) {
                backToTopBtn.style.display = "flex";
            } else {
                backToTopBtn.style.display = "none";
            }
        };

        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
