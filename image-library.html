<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/footer.css?v=2">

    <!-- Gallery CSS -->

<body class="gallery-page">

    <!-- ==========================================================

            <a href="index.html" class="msns-navbar-brand">

                <div class="msns-navbar-brand-text">
                    <span class="msns-navbar-brand-name">MSNS</span>
                    <span class="msns-navbar-brand-sub">Central College</span>
                </div>
            </a>

            <ul class="msns-navbar-menu">
                <li>
                    <a href="index.html" class="msns-nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        <span>Home</span>
                    </a>
                </li>
                <li>
                    <a href="about.html" class="msns-nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="16" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12.01" y2="8"></line>
                        </svg>
                        <span>About</span>
                    </a>
                </li>
                <li>
                    <a href="news.html" class="msns-nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path>
                            <path d="M18 14h-8"></path>
                            <path d="M15 18h-5"></path>
                            <path d="M10 6h8v4h-8V6Z"></path>
                        </svg>
                        <span>News</span>
                    </a>
                </li>
                <li>
                    <a href="image-library.html" class="msns-nav-link active-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <span>Gallery</span>
                    </a>
                </li>
                <li>
                    <a href="index.html#contact" class="msns-nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                        <span>Contact</span>
                    </a>
                </li>
            </ul>

            <div class="msns-navbar-actions">
                <a href="u.html" class="msns-nav-btn msns-nav-btn-profile">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Profile</span>
                </a>
                <a href="ab.html" class="msns-nav-btn msns-nav-btn-dev">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                        <path d="M12 11l1.5 3h-3z"></path>
                    </svg>
                    <span>Dev</span>
                </a>
            </div>

        </div>
    </nav>

    <!-- ==========================================================
         📱 MOBILE HEADER
         ========================================================== -->
    <header id="top">
        <a href="index.html" class="header-title" style="text-decoration:none;">
            <i class="fa-solid fa-arrow-left" style="font-size:1rem; margin-right:10px;"></i>Gallery
        </a>
        <div class="nav-icon" id="galleryTheme">
            <i class="fa-solid fa-images" style="font-size:18px;"></i>
        </div>
    </header>

    <!-- ==========================================================
         🎬 GALLERY TITLE
         ========================================================== -->
    <div class="gallery-title-wrap">
        <h1 class="gallery-title">School <span>Gallery</span></h1>
        <p class="gallery-subtitle">Explore moments of pride &amp; excellence</p>
    </div>

    <!-- ==========================================================
         🎡 3D IMAGE RING
         ========================================================== -->
    <div class="gallery-stage" id="galleryStage">
        <div class="gallery-container">
            <div class="gallery-ring" id="galleryRing">
                <!-- Images injected by JS -->
                <div class="gallery-loading" id="galleryLoading">
                    <i class="fa-solid fa-circle-notch fa-spin"></i>
                    <span>Loading gallery...</span>
                </div>
            </div>
        </div>

        <!-- Nav Arrows -->
        <button class="gallery-nav gallery-nav-prev" id="galleryPrev" aria-label="Previous">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button class="gallery-nav gallery-nav-next" id="galleryNext" aria-label="Next">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <!-- Hint -->
        <div class="gallery-hint">
            <i class="fa-solid fa-hand-pointer"></i>
            <span>Click image to view details</span>
        </div>
    </div>

    <!-- ==========================================================
         🖼️ LIGHTBOX MODAL
         ========================================================== -->
    <div class="gallery-modal" id="galleryModal">
        <button class="gallery-modal-close" id="modalClose" aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <button class="gallery-modal-nav gallery-modal-prev" id="modalPrev" aria-label="Previous">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button class="gallery-modal-nav gallery-modal-next" id="modalNext" aria-label="Next">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <div class="gallery-modal-inner" id="modalInner">
            <div class="gallery-modal-media">
                <img id="modalImage" src="" alt="">
                <div class="modal-counter" id="modalCounter">1 / 1</div>
            </div>
            <div class="gallery-modal-content">
                <div class="modal-badge">
                    <i class="fa-solid fa-image"></i>
                    <span>MSNS Gallery</span>
                </div>
                <h2 class="modal-title" id="modalTitle">—</h2>
                <div class="modal-line"></div>
                <p class="modal-desc" id="modalDesc">—</p>
            </div>
        </div>
    </div>

    <!-- ==========================================================
         SCRIPTS
         ========================================================== -->
    <script src="js/sheet.js?v=1"></script>
</body>

</html>
